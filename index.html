<html lang="zh-Hant"><head><meta charset="utf-8">

<title>泰文單字速查</title>

<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#12262b;--sub:#5b7077;--line:#d8e2e5;--acc:#0d7a6f;--accbg:#dff1ee;--star:#e0a100;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--card:#172a2e;--ink:#e6f0f1;--sub:#93aab0;--line:#264048;--acc:#4fd1c0;--accbg:#173b3a}}
:root[data-theme="dark"]{--bg:#0f1b1e;--card:#172a2e;--ink:#e6f0f1;--sub:#93aab0;--line:#264048;--acc:#4fd1c0;--accbg:#173b3a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "LXGW WenKai Lite","Noto Sans Thai",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 10px;z-index:2}
input{width:100%;padding:14px 16px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chips button{flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub);font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.w{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.w .t{flex:1;cursor:pointer}
.th{font-size:30px;font-weight:600;line-height:1.4;font-family:var(--thf,"Sarabun"),"Noto Sans Thai",sans-serif}
.ro{color:var(--acc);font-size:15px}.tr{color:var(--sub);font-size:15px}
.w button{border:0;background:none;font-size:22px;color:var(--line);cursor:pointer;padding:6px}
.w button.f{color:var(--star)}
.w:focus-within,.t:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.b{display:inline-block;margin-top:4px;padding:1px 10px;border-radius:999px;background:var(--accbg);color:var(--acc);font-size:13px}.ok{flex:none;border:1px solid var(--line)!important;border-radius:8px!important;font-size:13px!important;color:var(--acc)!important;padding:6px 10px!important}.sum{color:var(--sub);font-size:14px;margin-top:10px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}#add,#kbtn,#selbtn{flex:none;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--acc);font:inherit;font-size:14px;cursor:pointer}
#add{font-size:22px;line-height:1;padding:0 14px}.del{flex:none;font-size:15px!important;color:var(--sub)!important}.mvw{flex:none;font-size:16px!important;color:var(--acc)!important}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,520px);padding:18px}dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 6px}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.dbtn button{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.dbtn #ds{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.addq{display:block;width:100%;margin-top:12px;padding:12px;border:2px dashed var(--acc);border-radius:12px;background:none;color:var(--acc);font:inherit;cursor:pointer}.sum .ok{margin-left:6px;padding:4px 10px;background:none;border-radius:8px;cursor:pointer}
.kb{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);max-height:55vh;overflow-y:auto}.kb.on{display:flex}
.kb button{min-width:52px;height:56px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:32px var(--thf,"Sarabun"),"Noto Sans Thai",sans-serif;cursor:pointer}.kb .wd{min-width:120px;font-size:18px}
body.kbo{padding-bottom:300px}
input,textarea{font-family:var(--thf,"Sarabun"),"LXGW WenKai Lite","Noto Sans Thai",sans-serif}
label{display:block;font-size:13px;color:var(--sub);margin-top:10px}.fld{width:100%;margin-top:4px;padding:10px;font-size:17px;font-family:var(--thf,"Sarabun"),"LXGW WenKai Lite","Noto Sans Thai",sans-serif;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.crow{display:flex;gap:6px;align-items:center;margin-top:8px}.crow input{flex:1;padding:8px 10px;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.crow button{flex:none;border:1px solid var(--line);border-radius:8px;background:none;color:var(--sub);font-size:15px;padding:6px 10px;cursor:pointer}.crow .dh{flex:none;padding:6px 8px;font-size:18px;color:var(--sub);cursor:grab;touch-action:none;user-select:none}.crow.dragging{opacity:.5}

.w.selm{gap:10px}.selchk{flex:none;width:22px;height:22px;accent-color:var(--acc)}
.empty{text-align:center;color:var(--sub);padding:40px 0}

<div id="selbar" class="selbar" style="display:none"><span id="selcount"></span><button id="selall">全選</button><button id="bulkMove">移動</button><button id="bulkDel">刪除</button><button id="selCancel">取消</button></div>

</main>

<label>中文意思<input id="f2" class="fld"></label>

<label>分類<select id="f4" class="fld"></select><input id="f4new" class="fld" placeholder="輸入新分類名稱" style="display:none;margin-top:6px"></label>
<div id="msg" class="sum"></div><div class="dbtn"><button id="kt">ก 泰文鍵盤</button><button id="dc">取消</button><button id="ds">加入</button></div></dialog>
<dialog id="movDlg"><h3>移動分類</h3><div class="sum" id="movWord"></div><input id="movInp" class="fld" list="movList" placeholder="選擇或輸入分類"><datalist id="movList"></datalist><div class="dbtn"><button id="movCancel">取消</button><button id="movGo">移動</button></div></dialog>

  t.onclick=go;t.onkeydown=k=>{if(k.key=="Enter")go()};
  const ok=e.querySelector(".ok");if(ok)ok.onclick=()=>{hist[d[0]].ok=1;saveH();draw()};
  e.querySelector(".mvw").onclick=()=>openMove(d);
  const dl=e.querySelector(".del");if(dl)dl.onclick=()=>{custom=custom.filter(c=>c[0]!=d[0]);D.splice(D.indexOf(d),1);saveC();chips();draw()};
  e.lastChild.onclick=()=>{fav.has(d[0])?fav.delete(d[0]):fav.add(d[0]);save();draw()};
  L.appendChild(e)});
 if(!r.length&&q&&cat!="易忘"&&cat!="最近查過"&&cat!="★ 收藏")addBtn($("q").value.trim());
 updateSelbar()}
